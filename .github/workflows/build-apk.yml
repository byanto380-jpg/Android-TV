name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Nusantara TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create fallback .env from .env.example if missing
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Generate Debug Keystore for CI if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Assemble Unsigned Release APK
        run: gradle :app:assembleRelease --no-daemon -x lintVitalRelease || true

      - name: Rename Debug APK for Distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NusantaraTV-AndroidTV-debug.apk
          if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/NusantaraTV-AndroidTV-release-unsigned.apk
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NusantaraTV-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Nusantara TV v1.0.${{ github.run_number }}
          body: |
            Build otomatis Android TV Launcher & Dashboard **Nusantara TV**.
            Unduh `NusantaraTV-AndroidTV-debug.apk` lalu install di Android TV Box Anda.
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
